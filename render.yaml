# Render blueprint for the office server.
#
# The web app stays on Vercel; this is the other half — the WebSocket server,
# its SQLite file and the Notion polling. Render is chosen because it deploys
# straight from GitHub with no CLI, and because it can mount a real disk, which
# the free tiers of most hosts cannot.
#
# In Render: New → Blueprint → pick this repo. It reads this file, creates the
# service, and asks only for the three secrets marked `sync: false`.

services:
  - type: web
    name: wtoffice-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    # The build context is the repo root: the Dockerfile installs from the
    # workspace lockfile, so it needs every package.json, not just the server's.
    dockerContext: .
    region: frankfurt
    # A disk requires a paid instance (~$7/mo), which is why this is not `free`.
    #
    # To run it for nothing: set `plan: free` and delete the `disk:` block at
    # the bottom. The office works, but the service sleeps after 15 minutes idle
    # — so the first person in waits about a minute and Notion is not polled
    # while it sleeps — and every restart wipes profile pictures, notification
    # settings and remembered devices. Tasks are safe either way; they live in
    # Notion, not here.
    plan: starter
    healthCheckPath: /health
    envVars:
      # Render injects PORT; the server already reads it.
      - key: DB_PATH
        value: /data/office.db
      - key: NOTION_TASK_CATEGORY
        value: WT
      - key: NOTION_TASK_STATUS
        value: To Do
      # Prompted for on first deploy and never stored in the repo.
      - key: OFFICE_KEY
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_TASKS_DB
        sync: false
      # Voice relay. Without one, two people on unlucky home networks can be in
      # the same room hearing nothing, with no error anywhere to explain it.
      # Set either the three static values or the two Cloudflare ones; leave
      # them all blank and the office runs on STUN alone, as it did before.
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: TURN_KEY_ID
        sync: false
      - key: TURN_KEY_API_TOKEN
        sync: false
    disk:
      name: office-data
      mountPath: /data
      sizeGB: 1
